services:
  postgres:
    image: postgres:15-alpine
    container_name: mlflow_postgres
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
      POSTGRES_DB: mlflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: mlflow_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # MinIO console  →  http://localhost:9001
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: mlflow_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/mlflow-artifacts &&
        echo 'bucket mlflow-artifacts ready'
      "

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: mlflow_server
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "5000:5000" # MLflow UI  →  http://localhost:5000
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    command:
      - /bin/sh
      - -c
      - "pip install psycopg2-binary boto3 -q && mlflow server --backend-store-uri postgresql://mlflow:mlflow@postgres:5432/mlflow --artifacts-destination s3://mlflow-artifacts --serve-artifacts --host 0.0.0.0 --port 5000 --cors-allowed-origins '*'"
    volumes:
      - mlflow_data:/mlflow

  mlflow-proxy:
    image: nginx:alpine
    container_name: mlflow_proxy
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - mlflow

  api:
    build: .
    container_name: toxicity_api
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow-proxy:5001
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    volumes:
      - ./data/processed:/app/data/processed
    depends_on:
      - mlflow-proxy
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  mlflow_data:
